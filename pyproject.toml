[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "soundflow"
version = "0.1.0"
description = "Private, offline desktop dictation for Linux and Windows"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Soundflow contributors" }]
dependencies = [
    "PySide6>=6.8,<7",
    "dbus-next>=0.2.3,<1",
    "faster-whisper>=1.1,<2",
    "numpy>=2.1,<3",
    "pynput>=1.7.7,<2",
    "python-docx>=1.1,<2",
    "sounddevice>=0.5,<1",
]

[project.urls]
Repository = "https://github.com/Sayem-Ahmed-Shayeed/SoundFlow"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
build = [
    "pyinstaller>=6.11,<7",
]

[project.scripts]
soundflow = "soundflow.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soundflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
