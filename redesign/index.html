<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soundflow redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Mona+Sans:wdth,wght@75..125,200..900&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Noto+Sans+Bengali:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------------------------------------------------- */
:root {
  /* Type. Latin comes from the chosen family; Bangla always from Noto Sans Bengali. */
  --font: "Inter", "Noto Sans Bengali", system-ui, sans-serif;
  --head-wght: 640; --head-wdth: 100%;
  /* Tracking by size: small text stays open, large text tightens. */
  --track-s: -.004em; --track-m: -.016em; --track-l: -.021em;
  --r-window: 14px; --r-group: 12px; --r-control: 8px; --r-key: 6px;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --spec-bg: #04060A;
}
[data-type="mona"] {
  --font: "Mona Sans", "Noto Sans Bengali", system-ui, sans-serif;
  --head-wght: 680; --head-wdth: 106%;
  --track-s: 0em; --track-m: -.008em; --track-l: -.014em;
}
[data-type="instrument"] {
  --font: "Instrument Sans", "Noto Sans Bengali", system-ui, sans-serif;
  --head-wght: 600; --head-wdth: 100%;
  --track-s: .002em; --track-m: -.008em; --track-l: -.016em;
}
[data-theme="dark"] {
  color-scheme: dark;
  --page: #141518;
  --canvas: #000000; --side: #000000;
  --panel: #0D0E10; --raised: #16171A; --hover: #1C1D21; --press: #232429;
  --line: #1F2025; --line-2: #2F3036;
  --text: #F2F2EE; --text-2: #A6A7AD; --text-3: #85868D;
  --accent: #3FE0C5; --accent-hover: #6EEAD5; --on-accent: #02140F;
  --accent-soft: rgba(63, 224, 197, .12); --accent-text: #5EEAD0;
  --live: #FF5A52; --live-soft: rgba(255, 90, 82, .16);
  --ok: #5BD68A; --warn: #F2C14E; --danger: #FF6B66; --danger-soft: rgba(255, 107, 102, .12);
  --shadow: 0 30px 80px rgba(0, 0, 0, .55);
  --scrim: rgba(0, 0, 0, .66);
}
[data-theme="light"] {
  color-scheme: light;
  --page: #DEDED8;
  --canvas: #F7F7F4; --side: #F0F0EB;
  --panel: #FFFFFF; --raised: #EBEBE5; --hover: #E5E5DF; --press: #DCDCD5;
  --line: #E0E0D9; --line-2: #C9C9C1;
  --text: #131314; --text-2: #4E4F55; --text-3: #63646A;
  --accent: #0A7C6B; --accent-hover: #08695B; --on-accent: #FFFFFF;
  --accent-soft: rgba(10, 124, 107, .10); --accent-text: #08695B;
  --live: #D3332C; --live-soft: rgba(211, 51, 44, .12);
  --ok: #1D8A4D; --warn: #8F6400; --danger: #C4322D; --danger-soft: rgba(196, 50, 45, .10);
  --shadow: 0 24px 60px rgba(30, 30, 20, .18);
  --scrim: rgba(20, 20, 18, .38);
}

/* ---------- Base ------------------------------------------------------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.45; letter-spacing: var(--track-s);
  font-optical-sizing: auto; font-kerning: normal;
  background: var(--page); color: var(--text);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Bangla: no tracking (it would pull conjuncts apart) and a little more line room for vowel signs. */
:lang(bn) { letter-spacing: 0; }
p:lang(bn), p :lang(bn) { line-height: 1.6; }
svg { flex: none; }

/* ---------- Prototype chrome (outside the app) ----------------------------- */
.proto-bar {
  max-width: 1520px; margin: 0 auto; padding: 22px 28px 18px;
  display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between;
}
.proto-bar h1 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: var(--head-wght); font-stretch: var(--head-wdth); letter-spacing: var(--track-l); }
.proto-bar p { margin: 4px 0 0; color: var(--text-2); max-width: 68ch; }
.proto-ctl { display: flex; flex-wrap: wrap; gap: 10px; }

.gallery {
  max-width: 1520px; margin: 0 auto; padding: 6px 28px 90px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(600px, 100%), 1fr));
  gap: 44px 32px;
}
.frame { margin: 0; }
.frame figcaption { margin: 0 0 10px; }
.frame > figcaption h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: var(--track-m); }
.frame > figcaption p { margin: 2px 0 0; color: var(--text-2); font-size: 13px; max-width: 72ch; }
.holder { position: relative; width: 100%; aspect-ratio: 1180 / 740; border-radius: 12px; }
.holder > .win { position: absolute; top: 0; left: 0; transform-origin: 0 0; pointer-events: none; }
.holder > .desk { position: absolute; top: 0; left: 0; transform-origin: 0 0; pointer-events: none; }
.open-frame {
  position: absolute; inset: 0; z-index: 2; border: 0; border-radius: 14px; background: transparent;
}
.open-frame:hover { box-shadow: 0 0 0 2px var(--accent); }

.stage { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 0 16px 40px; }
.fit { position: relative; }
.fit > .win { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.desk-pill { min-height: 52px; display: grid; place-items: center; }
.stage-note { color: var(--text-2); font-size: 13px; text-align: center; max-width: 70ch; }

/* ---------- Window ------------------------------------------------------- */
.win {
  width: 1180px; height: 740px; position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--canvas); color: var(--text);
  border: 1px solid var(--line-2); border-radius: var(--r-window); box-shadow: var(--shadow);
}
.titlebar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 18px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; font-stretch: var(--head-wdth); }
.wcs { display: flex; gap: 2px; }
.wc { width: 32px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--text-3); display: grid; place-items: center; }
.wc:hover { background: var(--hover); color: var(--text); }
.app { flex: 1; display: flex; min-height: 0; }

/* Sidebar */
.side { width: 220px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: 6px 12px 14px; background: var(--side); }
.nav {
  display: flex; align-items: center; gap: 11px; width: 100%; height: 38px; padding: 0 11px;
  border: 0; border-radius: var(--r-control); background: transparent;
  color: var(--text-2); font-size: 14px; font-weight: 500; text-align: left;
}
.nav:hover { background: var(--hover); color: var(--text); }
.nav[aria-current="page"] { background: var(--raised); color: var(--text); }
.nav svg { color: var(--text-3); }
.nav[aria-current="page"] svg { color: var(--accent); }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 4px 0 6px; border-top: 1px solid var(--line); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); font-weight: 700; font-size: 12px; flex: none; }
.who { min-width: 0; flex: 1; }
.who strong { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); }

.content { flex: 1; min-width: 0; overflow: auto; padding: 6px 44px 32px 36px; position: relative; }
.content.flush { padding: 0; overflow: hidden; }
h1.page { margin: 0; font-size: 32px; line-height: 1.1; font-weight: var(--head-wght); font-stretch: var(--head-wdth); letter-spacing: var(--track-l); }
.sub { margin: 6px 0 0; color: var(--text-2); max-width: 64ch; }

/* ---------- Controls ------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 14px; border-radius: var(--r-control);
  border: 1px solid var(--line-2); background: var(--panel); font-weight: 550; font-size: 14px; white-space: nowrap;
  transition: background-color .15s ease, transform .12s var(--ease);
}
.btn:hover { background: var(--hover); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.sm { height: 32px; padding: 0 11px; font-size: 13px; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { background: var(--danger); border-color: transparent; color: #fff; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.quiet:hover { background: var(--hover); color: var(--text); }
.btn.big { height: 50px; padding: 0 24px 0 16px; border-radius: 25px; font-size: 16px; font-weight: 600; letter-spacing: var(--track-m); }
.btn.stop { background: var(--live); border-color: transparent; color: #fff; }
.btn:disabled { opacity: .7; }
.rec-glyph { width: 20px; height: 20px; border-radius: 50%; background: var(--on-accent); box-shadow: inset 0 0 0 6px var(--accent); }
.stop-glyph { width: 12px; height: 12px; border-radius: 3px; background: #fff; }
.link { border: 0; background: none; padding: 0; color: var(--accent-text); font-weight: 600; }
.link:hover { text-decoration: underline; }
kbd {
  display: inline-grid; place-items: center; min-width: 26px; height: 24px; padding: 0 7px;
  border-radius: var(--r-key); background: var(--raised); border: 1px solid var(--line-2); border-bottom-width: 2px;
  font: 550 12px var(--font); letter-spacing: 0; color: var(--text);
}
kbd.lg { min-width: 42px; height: 36px; padding: 0 12px; font-size: 14px; border-radius: 8px; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: var(--r-control); background: transparent; color: var(--text-2); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.toggle { width: 42px; height: 24px; flex: none; position: relative; border: 0; border-radius: 12px; background: var(--line-2); transition: background-color .16s var(--ease); }
.toggle span { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .16s var(--ease); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"] span { transform: translateX(18px); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--raised); flex-wrap: wrap; }
.seg button { height: 30px; padding: 0 13px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); font-weight: 500; }
.seg button:hover { color: var(--text); }
.seg button[aria-checked="true"] { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line-2), 0 1px 2px rgba(0,0,0,.2); }
.sel { position: relative; display: inline-flex; align-items: center; }
.sel select {
  appearance: none; height: 36px; padding: 0 34px 0 12px; min-width: 180px;
  border-radius: var(--r-control); border: 1px solid var(--line-2); background: var(--panel);
}
.sel svg { position: absolute; right: 10px; pointer-events: none; color: var(--text-3); }
.input, .area {
  height: 38px; padding: 0 12px; border-radius: var(--r-control); border: 1px solid var(--line-2); background: var(--panel); min-width: 0; width: 100%;
}
.input:focus, .area:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.area { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-weight: 600; font-size: 13px; }
.helper { color: var(--text-3); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 650; background: var(--accent-soft); color: var(--accent-text); }
.badge.plain { background: var(--raised); color: var(--text-2); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Spectrogram ------------------------------------------------- */
.ribbon { position: relative; height: 168px; border-radius: var(--r-group); background: var(--spec-bg); overflow: hidden; border: 1px solid #14161B; }
.ribbon canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ribbon-hint { position: absolute; left: 18px; bottom: 14px; color: #8C919B; font-size: 13px; }
.ribbon-axis { position: absolute; right: 14px; top: 12px; bottom: 12px; display: flex; flex-direction: column; justify-content: space-between; color: #6F7480; font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
.scan { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: #E8FFF9; box-shadow: 0 0 22px 6px rgba(63, 224, 197, .45); animation: scan 1.5s linear infinite; }
.scan-veil { position: absolute; inset: 0; background: rgba(4, 6, 10, .45); }
@keyframes scan { from { left: 0; } to { left: calc(100% - 2px); } }

/* ---------- Dictation home ---------------------------------------------- */
.home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; min-height: 66px; margin-bottom: 18px; }
.live-head { display: flex; align-items: baseline; gap: 16px; }
.live-label { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: var(--track-m); color: var(--live); }
.live-label.work { color: var(--accent-text); }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 5px var(--live-soft); display: inline-block; }
.timer { font-size: 56px; line-height: .95; font-weight: 560; font-stretch: var(--head-wdth); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.timer.dim { color: var(--text-3); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: 20px; }
.hint { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--text-2); }
.live-text { margin: 24px 0 0; font-size: 26px; line-height: 1.38; font-weight: 400; letter-spacing: var(--track-l); max-width: 30em; min-height: 2.76em; text-wrap: pretty; }
.live-text.dim { color: var(--text-2); }
.live-text .new { animation: word-in .22s var(--ease); }
@keyframes word-in { from { opacity: 0; } }
.caret { display: inline-block; width: 2px; height: 1em; margin-left: 4px; vertical-align: -.14em; background: var(--accent); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.today { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); }
.stat b { display: block; font-size: 26px; line-height: 1.15; font-weight: 560; font-stretch: var(--head-wdth); letter-spacing: var(--track-l); font-variant-numeric: tabular-nums; }
.stat span { color: var(--text-2); font-size: 13px; }
.recent { margin-top: 26px; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.row-head h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: var(--track-m); }
.entry { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 9px 10px; margin: 0 -10px; border-radius: var(--r-control); }
.entry:hover { background: var(--panel); }
.entry time { color: var(--text-3); font-size: 13px; font-variant-numeric: tabular-nums; }
.entry p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result { margin-top: 22px; padding: 20px 22px 16px; border-radius: var(--r-group); background: var(--panel); border: 1px solid var(--line); animation: rise .26s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.result p { margin: 0 0 16px; font-size: 20px; line-height: 1.5; letter-spacing: var(--track-m); max-width: 36em; text-wrap: pretty; }
.result-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--text-2); font-size: 13px; align-items: center; }
.pasted { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 600; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- History ------------------------------------------------------- */
.hist { display: grid; grid-template-columns: 356px minmax(0, 1fr); height: 100%; }
.hist-top .seg { flex-wrap: nowrap; align-self: flex-start; }
.hist-top .seg button { padding: 0 11px; font-size: 13px; }
.hist-list { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.hist-top { padding: 6px 18px 12px 22px; display: flex; flex-direction: column; gap: 12px; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 11px; border-radius: var(--r-control); border: 1px solid var(--line-2); background: var(--panel); color: var(--text-3); }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text); }
.hist-scroll { overflow: auto; padding: 0 12px 18px 14px; flex: 1; }
.day { padding: 14px 10px 6px; color: var(--text-3); font-size: 12px; font-weight: 600; }
.item { display: block; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; }
.item:hover { background: var(--panel); }
.item[aria-current="true"] { background: var(--raised); }
.item-meta { display: flex; gap: 12px; margin-bottom: 3px; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.item p { margin: 0; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item[aria-current="true"] p { color: var(--text); }
.empty { padding: 28px 12px; color: var(--text-2); }
.empty strong { display: block; color: var(--text); font-size: 16px; font-weight: 600; letter-spacing: var(--track-m); margin-bottom: 4px; }
.detail { position: relative; padding: 8px 44px 28px 40px; overflow: auto; display: flex; flex-direction: column; }
.detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.detail h2 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 600; font-stretch: var(--head-wdth); letter-spacing: var(--track-m); }
.facts-grid { display: flex; flex-wrap: wrap; gap: 10px 32px; margin: 14px 0 24px; color: var(--text-2); font-size: 12px; }
.facts-grid b { display: block; color: var(--text); font-size: 16px; font-weight: 550; letter-spacing: var(--track-m); font-variant-numeric: tabular-nums; }
.detail-text { margin: 0; font-size: 20px; line-height: 1.55; letter-spacing: var(--track-m); max-width: 34em; text-wrap: pretty; }
.editor { width: 100%; min-height: 210px; font-size: 20px; line-height: 1.55; letter-spacing: var(--track-m); padding: 14px 16px; border-radius: 10px; border: 1px solid var(--accent); background: var(--panel); box-shadow: 0 0 0 3px var(--accent-soft); resize: vertical; }
.edit-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.toolbar { display: flex; gap: 2px; align-items: center; }
.menu { position: absolute; right: 44px; top: 50px; z-index: 4; min-width: 180px; padding: 5px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
.menu button:hover { background: var(--hover); }
.menu .danger-item { color: var(--danger); }

/* ---------- Playground ------------------------------------------------------ */
.play { display: flex; flex-direction: column; height: 100%; padding: 6px 44px 26px 36px; }
.play-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 216px minmax(0, 1fr); gap: 16px; margin-top: 20px; }
.pane { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.pane textarea, .pane .out { flex: 1; min-height: 0; border-radius: var(--r-group); padding: 16px 18px; font-size: 16px; line-height: 1.6; }
.pane textarea { border: 1px solid var(--line-2); background: var(--panel); resize: none; }
.pane textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pane .out { border: 1px dashed var(--line-2); color: var(--text); overflow: auto; }
.pane .out.empty-out { color: var(--text-3); }
.actions { display: flex; flex-direction: column; gap: 8px; padding-top: 27px; }
.action { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); text-align: left; transition: background-color .15s ease, transform .12s var(--ease); }
.action:hover { background: var(--hover); }
.action:active { transform: scale(.98); }
.action[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.action strong { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.action span { color: var(--text-2); font-size: 12px; }

      if (mode === 'fade' && x > cols * 0.8) env *= Math.max(0, 1 - (x - cols * 0.8) / (cols * 0.2));
      col = synthColumn(t, env, r);
      if (mode === 'pill') for (let i = 0; i < BINS; i++) col[i] = Math.min(1, col[i] * 1.7);
      if (cv.dataset.dim) for (let i = 0; i < BINS; i++) col[i] *= 0.45;
    }
    writeColumn(buf, x, col);
  }
  if (mode === 'frozen' && S.view === 'app' && S.recorded && cv.closest('.ribbon')) {
    blit(cv, S.recorded, true); return;
  }
  blit(cv, buf, mode !== 'pill');
}

/* Live input: real microphone when allowed, else a synthetic voice */
const mic = { ok: false, an: null, data: null, rate: 48000, stream: null, ctx: null };
async function openMic() {
  if (mic.ok) return true;
  try {
    mic.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
    mic.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = mic.ctx.createMediaStreamSource(mic.stream);
    mic.an = mic.ctx.createAnalyser(); mic.an.fftSize = 2048; mic.an.smoothingTimeConstant = 0.35;
    src.connect(mic.an);
    mic.data = new Uint8Array(mic.an.frequencyBinCount); mic.rate = mic.ctx.sampleRate; mic.ok = true;
  } catch (err) { mic.ok = false; }
  return mic.ok;
}
function closeMic() {
  if (mic.stream) mic.stream.getTracks().forEach(t => t.stop());
  if (mic.ctx) mic.ctx.close();
  Object.assign(mic, { ok: false, an: null, data: null, stream: null, ctx: null });
}
const mel = f => 2595 * Math.log10(1 + f / 700), imel = m => 700 * (Math.pow(10, m / 2595) - 1);
function micColumn() {
  mic.an.getByteFrequencyData(mic.data);
  const col = new Float32Array(BINS), lo = mel(70), hi = mel(7600), n = mic.data.length;
  for (let i = 0; i < BINS; i++) {
    const f = imel(lo + (hi - lo) * i / (BINS - 1));
    const idx = Math.min(n - 1, Math.round(f / (mic.rate / 2) * n));
    const v = mic.data[idx] / 255;
    col[i] = Math.max(0, Math.min(1, (v - 0.28) / 0.55));
  }
  return col;
}

/* ======================================================================
   Live dictation simulation
   ====================================================================== */
let live = null, toastT = null, dlT = null;
function startDictation() {
  const a = S.app;
  if (a.home === 'listening' || a.home === 'transcribing') return;
  Object.assign(a, { home: 'listening', liveWords: 0, elapsed: 0, pill: a.prefs.pill ? 'listening' : null });
  S.recorded = null;
  render();
  openMic();
}
function attachLive() {
  const cv = stage.querySelector('.ribbon canvas[data-mode="live"]');
  const pcv = stage.querySelector('.desk-pill canvas');
  if (!cv) return;
  sizeCanvas(cv); if (pcv) sizeCanvas(pcv);
  const cols = colsFor(cv);
  const buf = document.createElement('canvas'); buf.width = cols; buf.height = BINS;
  const pbuf = document.createElement('canvas'); pbuf.width = 72; pbuf.height = BINS;
  const r = rng(7);
  for (let x = 0; x < cols; x++) writeColumn(buf, x, silenceColumn(r));
  for (let x = 0; x < 72; x++) writeColumn(pbuf, x, silenceColumn(r));
  const t0 = performance.now() - S.app.elapsed * 1000;
  live = { cv, pcv, buf, pbuf, cols, r, t0, last: performance.now(), acc: 0, raf: 0 };
  const step = now => {
    if (!live) return;
    const a = S.app, dt = Math.min(0.1, (now - live.last) / 1000);
    live.last = now; a.elapsed = (now - live.t0) / 1000;
    const col = mic.ok ? micColumn() : synthColumn(a.elapsed, speechEnv(a.elapsed), live.r);
    let energy = 0; for (let i = 4; i < 40; i++) energy += col[i]; energy /= 36;
    for (const [b, n] of [[live.buf, live.cols], [live.pbuf, 72]]) {
      const c = b.getContext('2d'); c.drawImage(b, -1, 0); writeColumn(b, n - 1, col);
    }
    blit(live.cv, live.buf, true);
    if (live.pcv) blit(live.pcv, live.pbuf, false);
    live.acc += dt * (mic.ok ? (energy > 0.16 ? 3.4 : 0) : 2.7);
    if (live.acc >= 1 && a.liveWords < WORDS.length) {
      live.acc = 0; a.liveWords++;
      const p = stage.querySelector('[data-live]');
      if (p) {
        const shown = WORDS.slice(0, a.liveWords - 1).join(' ');
        p.innerHTML = `${esc(shown)}${shown ? ' ' : ''}<span class="new">${esc(WORDS[a.liveWords - 1])}</span><i class="caret"></i>`;
      }
    }
    const tm = stage.querySelector('[data-timer]'); if (tm) tm.textContent = fmt(a.elapsed);
    const pt = stage.querySelector('[data-pill-timer]'); if (pt) pt.textContent = fmt(a.elapsed);
    live.raf = requestAnimationFrame(step);
  };
  live.raf = requestAnimationFrame(step);
}
function stopLive() {
  if (!live) return;
  cancelAnimationFrame(live.raf);
  S.recorded = live.buf;
  live = null;
}
let micTestRaf = 0;
async function startMicTest() {
  cancelAnimationFrame(micTestRaf);
  await openMic();
  const td = mic.ok ? new Float32Array(mic.an.fftSize) : null;
  const t0 = performance.now();
  let level = 0;
  const step = now => {
    const bar = stage.querySelector('.meter i');
    if (!bar || !S.app.prefs.micTest || S.app.home === 'listening') {
      if (S.app.home !== 'listening') closeMic();
      S.app.prefs.micTest = false; return;
    }
    let v;
    if (td) { mic.an.getFloatTimeDomainData(td); let sum = 0; for (const x of td) sum += x * x; v = Math.min(1, Math.sqrt(sum / td.length) * 7); }
    else v = speechEnv((now - t0) / 1000) * 0.8;
    level = v > level ? v : level + (v - level) * 0.12;
    bar.style.transform = `scaleX(${level.toFixed(3)})`;
    micTestRaf = requestAnimationFrame(step);
  };
  micTestRaf = requestAnimationFrame(step);
}
function stopDictation() {
  const a = S.app;
  if (a.home !== 'listening') return;
  stopLive(); closeMic();
  if (!a.liveWords) a.liveWords = Math.min(WORDS.length, Math.max(4, Math.round(a.elapsed * 2.7)));
  Object.assign(a, { home: 'transcribing', pill: a.prefs.pill ? 'transcribing' : null });
  render();
  setTimeout(() => {
    if (a.home !== 'transcribing') return;
    const text = WORDS.slice(0, Math.max(a.liveWords, 6)).join(' ').replace(/[,]$/, '') + (a.liveWords >= WORDS.length ? '' : '.');
    S.result = { text, dur: Math.max(1, Math.round(a.elapsed)) };
    HISTORY.unshift({ id: Date.now(), day: 'Today', time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), dur: S.result.dur, lang: 'English', text });
    Object.assign(a, { home: 'done', pill: a.prefs.pill ? 'done' : null });
    render();
    setTimeout(() => { if (a.pill === 'done') { a.pill = null; const dp = stage.querySelector('.desk-pill'); if (dp) dp.innerHTML = ''; } }, 900);
  }, REDUCE ? 600 : 1600);
}
function cancelDictation() {
  const a = S.app;
  if (a.home !== 'listening') return;
  stopLive(); closeMic();
  Object.assign(a, { home: 'idle', liveWords: 0, elapsed: 0, pill: null });
  render();
}

  'ai-test': () => { S.app.prefs.aiTest = 'The key works.'; render(); },
  'run-check': () => { S.app.checks = 'running'; render(); setTimeout(() => { S.app.checks = 'done'; if (S.view === 'app') render(); }, 1200); },
  signout: () => { S.app.auth = 'signin'; render(); },
  auth: t => { S.app.auth = t.dataset.value; render(); },
  'auth-done': () => { S.app.auth = null; S.app.screen = 'home'; render(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.action];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input;
  if (k === 'hist-q') {
    S.app.hist.q = e.target.value; const pos = e.target.selectionStart; render();
    const i = stage.querySelector('[data-input="hist-q"]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  } else if (k === 'play-in') S.app.play.input = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.matches('.home-head select, .prefs-body select[aria-label="Language"]')) S.app.lang = e.target.value;
});
const typing = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
let ptt = false;
document.addEventListener('keydown', e => {
  if (S.view !== 'app') return;
  const a = S.app;
  if (a.shortcut.recording && !['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) {
    e.preventDefault();
    if (e.key === 'Escape') { a.shortcut.recording = false; render(); return; }
    const k = []; if (e.ctrlKey) k.push('Ctrl'); if (e.altKey) k.push('Alt'); if (e.shiftKey) k.push('Shift');
    k.push(e.code === 'Space' ? 'Space' : e.key.length === 1 ? e.key.toUpperCase() : e.key);
    a.shortcut.ptt = k; a.shortcut.recording = false; render(); return;
  }
  if (e.key === 'Escape') {
    if (a.dialog) { a.dialog = null; render(); return; }
    if (a.hist.editing) { a.hist.editing = false; render(); return; }
    if (a.hist.menu) { a.hist.menu = false; render(); return; }
    if (a.home === 'listening') { cancelDictation(); return; }
  }
  if (a.hist.editing && e.ctrlKey && e.key === 'Enter') { A['hist-save'](); return; }
  if (a.auth || a.screen !== 'home') return;
  if (e.code === 'Space' && e.ctrlKey && e.altKey && !e.repeat) { e.preventDefault(); ptt = true; startDictation(); return; }
  if (e.code === 'Space' && !typing(document.activeElement) && !e.repeat) {
    e.preventDefault();
    if (a.home === 'listening') stopDictation(); else startDictation();
  }
});
document.addEventListener('keyup', e => {
  if (ptt && (e.code === 'Space' || e.key === 'Control' || e.key === 'Alt')) { ptt = false; stopDictation(); }
});

render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); if (!live) paintAll(stage); });
})();
</script>
</body>
