<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soundflow sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@1,400;1,700&family=Hind+Siliguri:wght@400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Figtree:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #FFFFEB; --surface: #FFFFFF; --hover: #F1F1DC;
    --border: #E4E4D0; --border-strong: #D2D2BC;
    --text: #1A1A1A; --text2: #55554C; --text3: #6F6F65;
    --accent: #034F46; --accent-text: #0B6B5E;
    --primary: #F0D7FF; --primary-hover: #E6C2FF; --primary-text: #1A1A1A;
    --desk: #DCDCC8;
    --danger: #C4322D; --warning: #8F6400; --good: #3F8E7C; --strong: #034F46;
    --glide: cubic-bezier(.22,1,.36,1);
  }
  :root[data-theme="dark"] {
    --canvas: #0E1412; --surface: #151C19; --hover: #1C2421;
    --border: #222B28; --border-strong: #33403B;
    --text: #F4F4E2; --text2: #B5B8AA; --text3: #9A9E90;
    --accent: #7FD6BE; --accent-text: #8FDCC6;
    --primary: #E2C2FA; --primary-hover: #EDD5FF; --primary-text: #1A1A1A;
    --desk: #050807;
    --danger: #FF7A6E; --warning: #F2C14E; --good: #4FB49A; --strong: #7FD6BE;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--desk);
    font-family: "Figtree", sans-serif;
    color: var(--text);
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .window {
    width: min(1000px, 100%);
    height: 640px;
    background: var(--canvas);
    border-radius: 14px;
    box-shadow: 0 30px 80px rgba(20, 20, 10, .18);
    display: grid;
    grid-template-columns: 1fr 420px;
    overflow: hidden;
  }

  /* ---- art panel ---- */
  .art {
    position: relative;
    margin: 14px 0 14px 14px;
    border-radius: 18px;
    overflow: hidden;
    background: #06100D;
  }
  .art .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .art::after {               /* scrim so the words always read */
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,16,13,0) 40%, rgba(6,16,13,.55) 66%, rgba(6,16,13,.9) 100%);
    pointer-events: none;
  }
  .art::before {             /* a light shade at the top so the masthead reads */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 34%; z-index: 1;
    background: linear-gradient(180deg, rgba(6,16,13,.55), rgba(6,16,13,0));
    pointer-events: none;
  }
  .cover-top { position: absolute; z-index: 2; left: 0; right: 0; top: 22px; text-align: center; color: #FFFFEB; }
  .mast { margin: 0; font: 500 76px/1 "Bodoni Moda", serif; font-variation-settings: "opsz" 96; letter-spacing: -2.5px; }
  .tagline { margin: 6px 0 0; font: italic 400 19px/1.2 "Lato", sans-serif; letter-spacing: .02em; color: #E6C2FF; }
  .cover-lines { position: absolute; z-index: 2; left: 32px; right: 28px; bottom: 30px; color: #FFFFEB; }
  .cover-lines h1 { margin: 0; font: italic 400 44px/1.02 "Bodoni Moda", serif; font-variation-settings: "opsz" 96; letter-spacing: -0.8px; }
  .cover-lines p { margin: 0 0 6px; font: italic 400 15px/1.4 "Lato", sans-serif; color: #B9D8CF; }
  .cover-lines p b { color: #E6C2FF; font-weight: 700; }
  .cover-lines .bn { font-family: "Hind Siliguri", sans-serif; font-style: normal; font-weight: 500; }

  /* ---- form ---- */
  .form {
    padding: 28px 48px 40px;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .brand svg { width: 22px; height: 22px; }
  .page { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .page[hidden] { display: none; }
  h2 {
    font-family: "Bodoni Moda", serif;
    font-variation-settings: "opsz" 72;
    font-weight: 500;
    font-size: 31px;
    line-height: 1.05;
    letter-spacing: -0.8px;
    margin: 0 0 8px;
  }
  .sub { color: var(--text2); font-size: 14px; line-height: 1.45; margin: 0 0 28px; max-width: 34ch; }
  .label-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  label { font-size: 13px; font-weight: 600; color: var(--text); }
  .link { background: none; border: 0; padding: 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--accent-text); cursor: pointer; }
  .link:hover { color: var(--text); }
  .link:focus-visible { text-decoration: underline; outline: none; }
  .field { position: relative; margin-bottom: 20px; }
  input {
    width: 100%; height: 44px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    border-radius: 8px;
    padding: 0 14px;
    font: inherit; font-size: 15px; color: var(--text);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder { color: #A3A396; }
  input:hover { border-color: var(--text3); }
  input:focus { outline: none; border-color: var(--accent); }
  .field.pw input { padding-right: 46px; }
  .eye {
    position: absolute; right: 6px; top: 6px;
    width: 32px; height: 32px;
    border: 0; border-radius: 8px; background: transparent;
    color: var(--text3); cursor: pointer;
    display: grid; place-items: center;
  }
  .eye:hover { background: var(--hover); color: var(--text); }
  .eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .eye svg { width: 18px; height: 18px; }
  .eye { transition: transform .12s var(--glide), background-color .15s ease; }
  .eye:active { transform: scale(.85); }
  .eye svg { grid-area: 1 / 1; transition: opacity .18s var(--glide), transform .18s var(--glide), filter .18s var(--glide); }
  .eye .off, .eye[aria-pressed="true"] .on { opacity: 0; transform: scale(.6); filter: blur(2px); }
  .eye[aria-pressed="true"] .off { opacity: 1; transform: none; filter: none; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 12px; color: var(--text3); margin: -12px 0 20px; }
  .primary {
    height: 46px; width: 100%;
    border: 0; border-radius: 8px;
    background: var(--primary); color: var(--primary-text);
    font: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: background-color .15s ease, transform .12s cubic-bezier(.23,1,.32,1);
  }
  .primary:hover { background: var(--primary-hover); }
  .primary:focus-visible { outline: 2px solid var(--text); outline-offset: 0; }
  .primary:active { transform: scale(.985); }
  .theme { position: fixed; top: 16px; right: 16px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  .switch { text-align: center; font-size: 13px; color: var(--text2); margin-top: 20px; }


  /* ---- motion (from Motion Brew's AuthCard, rebuilt in CSS) ---- */
  @keyframes enter { from { opacity: 0; transform: translateY(16px); } }
  @keyframes roll  { from { opacity: 0; transform: translateY(6px); filter: blur(4px); } }
  @keyframes shake { 0%,100% { transform: none; } 15% { transform: translateX(-7px); } 30% { transform: translateX(7px); }
                     48% { transform: translateX(-5px); } 66% { transform: translateX(5px); } 84% { transform: translateX(-2px); } }
  @keyframes pop   { from { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.15) rotate(4deg); } }
  @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(160%); } }
  @keyframes ripple { from { transform: translate(-50%,-50%) scale(.2); opacity: .8; } to { transform: translate(-50%,-50%) scale(5); opacity: 0; } }
  .window { animation: enter .55s var(--glide) both; }
  .page.entering > * { animation: roll .35s var(--glide) both; animation-delay: calc(var(--i, 0) * 30ms); }

  input { transition: border-color .15s ease, box-shadow .2s var(--glide); }
  input:focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent); }
  .field.invalid input { border-color: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 14%, transparent); }
  .err { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--danger);
         margin: -12px 0 14px; animation: roll .25s var(--glide) both; }
  .err svg { width: 14px; height: 14px; flex: none; animation: pop .35s var(--glide) both; }
  .shake { animation: shake .45s ease-out; }

  .meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: -10px 0 6px; }
  .meter i { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; position: relative; }
  .meter i::after { content: ""; position: absolute; inset: 0; background: var(--bar, var(--border)); transform: scaleX(0); transform-origin: left;
                    transition: transform .3s var(--glide), background-color .2s ease; transition-delay: calc(var(--n) * 40ms); }
  .meter i.on::after { transform: scaleX(1); }
  .meter-label { font-size: 12px; color: var(--text3); margin: 0 0 18px; min-height: 16px; transition: color .2s ease; }

  .primary { position: relative; overflow: hidden; }
  .primary .label { display: inline-block; }
  .primary .label.swap { animation: roll .3s var(--glide) both; }
  .primary.busy { cursor: progress; }
  .primary.busy::before { content: ""; position: absolute; inset: 0; width: 45%;
     background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
     animation: sheen 1.4s ease-in-out infinite; }
  .primary.done { background: var(--strong); color: var(--canvas); transition: background-color .3s ease, color .3s ease; }
  .primary .ring { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%;
     background: color-mix(in srgb, var(--canvas) 45%, transparent); animation: ripple .8s var(--glide) forwards; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 0s !important; }
  }

  @media (max-width: 860px) {
    .mast { font-size: 54px; }
    .cover-lines h1 { font-size: 34px; }
    .window { grid-template-columns: 1fr; height: auto; }
    .art { height: 300px; margin: 12px 12px 0; }
    .form { padding: 24px 20px 32px; }
  }
</style>
</head>
<body>
<button class="theme" type="button" id="theme">Dark</button>
<div class="window">
  <section class="art" aria-hidden="true">
    <img class="photo" src="auth-flowers.jpg" alt="">
    <div class="cover-top">
      <p class="mast">Soundflow</p>
    </div>
    <div class="cover-lines">
      <h1>Delulu ideas,<br>perfectly spelled.</h1>
    </div>
  </section>

  <section class="form">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" style="color: var(--accent)"><rect x="3" y="9" width="2.6" height="6" rx="1.3"/><rect x="7.4" y="5" width="2.6" height="14" rx="1.3"/><rect x="11.8" y="8" width="2.6" height="8" rx="1.3"/><rect x="16.2" y="3" width="2.6" height="18" rx="1.3"/><rect x="20.4" y="10" width="2.6" height="4" rx="1.3"/></svg>
      Soundflow
    </div>

    <div class="page" id="signin">
      <h2>Sign in to Soundflow</h2>
      <p class="sub">Your transcripts sync to every computer you sign in on.</p>
      <div class="label-row"><label for="in-email">Email</label></div>
      <div class="field"><input id="in-email" type="email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="label-row"><label for="in-pw">Password</label><button class="link" type="button">Forgot password?</button></div>
      <div class="field pw">
        <input id="in-pw" type="password" autocomplete="current-password">
        <button class="eye" type="button" aria-label="Show password" aria-pressed="false"></button>
      </div>
      <button class="primary" id="in-submit" type="button"><span class="label">Sign in</span></button>
      <div class="switch">New to Soundflow? <button class="link" data-go="signup" type="button">Create an account</button></div>
    </div>

    <div class="page" id="signup" hidden>
      <h2>Create your account</h2>
      <p class="sub">Every dictation is saved to it, so History follows you between computers.</p>
      <div class="label-row"><label for="up-name">Full name</label></div>
      <div class="field"><input id="up-name" autocomplete="name"></div>
      <div class="label-row"><label for="up-email">Email</label></div>
      <div class="field"><input id="up-email" type="email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="split">
        <div>
          <div class="label-row"><label for="up-pw">Password</label></div>
          <div class="field pw"><input id="up-pw" type="password" autocomplete="new-password"><button class="eye" type="button" aria-label="Show password" aria-pressed="false"></button></div>
        </div>
        <div>
          <div class="label-row"><label for="up-pw2">Confirm password</label></div>
          <div class="field pw"><input id="up-pw2" type="password" autocomplete="new-password"><button class="eye" type="button" aria-label="Show password" aria-pressed="false"></button></div>
        </div>
      </div>
      <div class="meter" aria-hidden="true"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i></div>
      <p class="meter-label" id="meter-label">At least 8 characters.</p>
      <button class="primary" id="up-submit" type="button"><span class="label">Create account</span></button>
      <div class="switch">Already have an account? <button class="link" data-go="signin" type="button">Sign in</button></div>
    </div>
  </section>
</div>

<script>
/* ---------- password eye ---------- */
const EYE_ON = '<svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.5M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';
document.querySelectorAll('.eye').forEach(btn => {
  btn.innerHTML = EYE_ON + EYE_OFF;
  btn.addEventListener('click', () => {
    const input = btn.previousElementSibling;
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.setAttribute('aria-pressed', String(show));
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
});
function showPage(id){
  for (const page of document.querySelectorAll('.page')) {
    page.hidden = page.id !== id;
    page.classList.remove('entering');
  }
  const page = document.getElementById(id);
  [...page.children].forEach((child, i) => child.style.setProperty('--i', i));
  void page.offsetWidth;                 // restart the roll
  page.classList.add('entering');
  page.querySelectorAll('.err').forEach(e => e.remove());
  page.querySelectorAll('.invalid').forEach(f => f.classList.remove('invalid'));
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => showPage(b.dataset.go)));

/* ---------- field errors ---------- */
const WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>';
function setError(input, text){
  const field = input.closest('.field');
  const old = field.nextElementSibling;
  if (old && old.classList.contains('err')) old.remove();
  field.classList.toggle('invalid', !!text);
  if (text) field.insertAdjacentHTML('afterend', `<p class="err" role="alert">${WARN}${text}</p>`);
}
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
document.querySelectorAll('input[type=email]').forEach(input => {
  let timer;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    setError(input, '');
    timer = setTimeout(() => {   // check once typing pauses, not on every key
      if (input.value && !EMAIL.test(input.value)) setError(input, "That email doesn't look right.");
    }, 800);
  });
});

document.querySelectorAll('input:not([type=email])').forEach(input =>
  input.addEventListener('input', () => { if (input.closest('.field').classList.contains('invalid')) setError(input, ''); }));

/* ---------- password strength ---------- */
const STRENGTH = [['', 'At least 8 characters.'], ['--danger', 'Weak'], ['--warning', 'Fair'], ['--good', 'Good'], ['--strong', 'Strong']];
document.getElementById('up-pw').addEventListener('input', e => {
  const v = e.target.value;
  let score = 0;
  if (v.length) score = 1;
  if (v.length >= 8) score = 2;
  if (v.length >= 8 && /[0-9]/.test(v) && /[a-zA-Z]/.test(v)) score = 3;
  if (v.length >= 12 && /[^a-zA-Z0-9]/.test(v)) score = 4;
  const [tone, text] = STRENGTH[score];
  document.querySelectorAll('.meter i').forEach((bar, i) => {
    bar.classList.toggle('on', i < score);
    bar.style.setProperty('--bar', tone ? `var(${tone})` : 'var(--border)');
  });
  const label = document.getElementById('meter-label');
  label.textContent = text;
  label.style.color = tone ? `var(${tone})` : '';
});

/* ---------- submit: shake on errors, then busy, then done ---------- */
function swapLabel(button, text){
  const label = button.querySelector('.label');
  label.textContent = text;
  label.classList.remove('swap'); void label.offsetWidth; label.classList.add('swap');
}
function submit(page, button, checks, words){
  if (button.classList.contains('busy')) return;
  let ok = true;
  for (const [input, message] of checks) {
    const text = message(input.value);
    setError(input, text);
    if (text) ok = false;
  }
  if (!ok) {
    page.classList.remove('shake'); void page.offsetWidth; page.classList.add('shake');
    return;
  }
  button.classList.add('busy');
  swapLabel(button, words[1]);
  setTimeout(() => {                      // the preview pretends the server answered
    button.classList.remove('busy');
    button.classList.add('done');
    swapLabel(button, words[2]);
    const ring = document.createElement('span'); ring.className = 'ring'; button.append(ring);
    setTimeout(() => { ring.remove(); button.classList.remove('done'); swapLabel(button, words[0]); }, 1800);
  }, 1200);
}
const need = (msg) => (v) => v ? '' : msg;
const email = (v) => !v ? 'Enter your email.' : EMAIL.test(v) ? '' : "That email doesn't look right.";
const $ = (id) => document.getElementById(id);
$('in-submit').addEventListener('click', () => submit($('signin'), $('in-submit'),
  [[$('in-email'), email], [$('in-pw'), need('Enter your password.')]],
  ['Sign in', 'Signing you in', "You're in"]));
$('in-pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('in-submit').click(); });
$('up-submit').addEventListener('click', () => submit($('signup'), $('up-submit'),
  [[$('up-name'), need('Tell us what to call you.')], [$('up-email'), email],
   [$('up-pw'), (v) => v.length >= 8 ? '' : 'Use at least 8 characters.'],
   [$('up-pw2'), (v) => v && v === $('up-pw').value ? '' : "The passwords don't match."]],
  ['Create account', 'Setting things up', 'Account ready']));

document.getElementById('theme').addEventListener('click', e => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  e.target.textContent = dark ? 'Light' : 'Dark';
});

</script>
</body>
</html>
