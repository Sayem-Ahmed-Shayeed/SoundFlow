<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="description" content="Soundflow — private, on-device voice dictation." />
  <title>Soundflow — Private Dictation</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #0a0a0c;
  --bg-elevated: #0e0e11;
  --surface: #121216;
  --surface-2: #17171c;
  --surface-3: #1c1c22;
  --text: #f4f1ee;
  --text-2: #c8c3c0;
  --text-3: #918b8a;
  --text-4: #6f6969;
  --line: #2b292d;
  --line-soft: #211f23;
  --accent: #c98bbd;
  --accent-strong: #e4a2d6;
  --accent-soft: rgba(201, 139, 189, .12);
  --success: #67c9a8;
  --success-soft: rgba(103, 201, 168, .12);
  --warning: #d9b66f;
  --warning-soft: rgba(217, 182, 111, .12);
  --danger: #e58c92;
  --danger-soft: rgba(229, 140, 146, .12);
  --focus: #e4a2d6;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --shadow-popover: 0 18px 60px rgba(0,0,0,.42);
  --sidebar: 224px;
  --content-max: 1180px;
  --pad: 32px;
  --ease: cubic-bezier(.2,.75,.2,1);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    radial-gradient(900px 700px at 68% -12%, rgba(201,139,189,.05), transparent 58%),
    var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { color: inherit; }
svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.svg-sprite { width: 0; height: 0; position: absolute; overflow: hidden; }
::selection { background: rgba(201,139,189,.32); }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.app-shell { min-height: 100vh; }
.sidebar {
  width: var(--sidebar);
  position: fixed;
  inset: 0 auto 0 0;
  padding: 26px 18px 20px;
  border-right: 1px solid var(--line-soft);
  background: rgba(10,10,12,.96);
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 4px 8px 28px;
}
.brand-mark {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  color: var(--accent);
}
.brand-mark svg { width: 28px; height: 28px; stroke-width: 2.1; }
.brand strong { display:block; font-size: 18px; letter-spacing: -.02em; font-weight: 630; }
.brand small { display:block; color: var(--text-3); margin-top: 1px; font-size: 12px; letter-spacing: .015em; }
.nav-list { display: grid; gap: 4px; }
.nav-list a {
  min-height: 44px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  transition: background 140ms var(--ease), color 140ms var(--ease);
}
.nav-list a:hover { background: rgba(255,255,255,.035); color: var(--text); }
.nav-list a.active { background: var(--accent-soft); color: var(--text); }
.nav-list a.active::before {
  content:"";
  position:absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 2px;
  border-radius: 3px;
  background: var(--accent);
}
.nav-list a svg { width: 18px; height: 18px; color: var(--text-3); }
.nav-list a.active svg { color: var(--accent-strong); }
.privacy-block {
  margin-top: auto;
  border-top: 1px solid var(--line-soft);
  padding: 18px 8px 2px;
  display: grid;
  grid-template-columns: 8px 1fr auto;
  align-items: start;
  gap: 9px;
  color: var(--text-3);
}
.privacy-block strong { color: var(--success); font-size: 13px; font-weight: 560; display:block; line-height: 1.2; }
.privacy-block span:not(.status-dot) { display:block; font-size: 11px; margin-top: 5px; line-height:1.35; }
.privacy-block svg { width: 17px; height: 17px; margin-top: 1px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; background: var(--text-4); box-shadow: 0 0 0 3px rgba(255,255,255,.02); }
.status-dot--ready { background: var(--success); box-shadow: 0 0 0 4px rgba(103,201,168,.08); }
.status-dot--live { background: var(--accent-strong); box-shadow: 0 0 0 4px rgba(228,162,214,.09); }

.main {
  min-height: 100vh;
  margin-left: var(--sidebar);
  padding: 0 var(--pad) 60px;
}
.page {
  width: min(100%, var(--content-max));
  margin: 0 auto;
  padding-top: 42px;
  animation: pageIn 220ms var(--ease);
}
@keyframes pageIn { from { opacity: .65; transform: translateY(4px); } to { opacity:1; transform:none; } }
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 30px;
}
.eyebrow { color: var(--accent-strong); text-transform: uppercase; font-size: 11px; letter-spacing: .13em; font-weight: 650; margin-bottom: 7px; }
.page-title {
  font-family: var(--serif);
  font-size: clamp(30px, 3.2vw, 42px);
  line-height: 1.06;
  letter-spacing: -.035em;
  font-weight: 500;
  margin: 0;
}
.page-subtitle { color: var(--text-3); max-width: 620px; margin: 9px 0 0; font-size: 14px; }
.page-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }

.button {
  min-height: 42px;
  border-radius: var(--radius-sm);
  padding: 0 15px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 520;
  transition: transform 120ms var(--ease), border-color 120ms var(--ease), background 120ms var(--ease), color 120ms var(--ease);
}
.button:hover { background: var(--surface-3); border-color: #3a373d; color: var(--text); }
.button:active { transform: translateY(1px); }
.button--primary { background: var(--text); border-color: var(--text); color: #111115; }
.button--primary:hover { background: #fff; border-color: #fff; color: #0d0d10; }
.button--accent { background: var(--accent); border-color: var(--accent); color: #170f15; }
.button--accent:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: #120d11; }
.button--quiet { background: transparent; border-color: transparent; color: var(--text-3); }
.button--quiet:hover { background: rgba(255,255,255,.04); border-color: transparent; }
.button--danger { color: var(--danger); background: transparent; }
.button--danger:hover { background: var(--danger-soft); border-color: rgba(229,140,146,.25); }
.button svg { width: 17px; height: 17px; }
.button:disabled { opacity:.42; cursor:not-allowed; transform:none; }
.icon-button { width: 42px; padding: 0; }

.select, .input, .textarea {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  padding: 0 12px;
  outline: none;
  transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease), background 140ms var(--ease);
}
.select { appearance:none; padding-right:38px; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%),linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 17px) 18px,calc(100% - 12px) 18px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
.input::placeholder, .textarea::placeholder { color: var(--text-4); }
.input:hover, .select:hover, .textarea:hover { border-color: #39363c; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(201,139,189,.10); }
.textarea { min-height: 120px; padding: 12px; resize: vertical; line-height:1.55; }
.label { display:block; color: var(--text-2); font-size: 13px; margin-bottom: 7px; }
.help { color: var(--text-3); font-size: 12px; margin-top: 6px; line-height:1.45; }

.status-chip {
  min-height: 36px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text-2);
  font-size: 12px;
  background: rgba(255,255,255,.015);
  white-space: nowrap;
}
.status-chip--ready { border-color: rgba(103,201,168,.25); color: var(--success); background: var(--success-soft); }
.status-chip--live { border-color: rgba(228,162,214,.25); color: var(--accent-strong); background: var(--accent-soft); }
.status-chip .status-dot { margin-top:0; }

.dictation-stage {
  position: relative;
  min-height: 430px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,.014), transparent 45%), var(--bg-elevated);
  display: grid;
  place-items: center;
  isolation:isolate;
}
.dictation-stage::before {
  content:"";
  position:absolute;
  width: 560px;
  height: 560px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(201,139,189,.10), rgba(201,139,189,.025) 36%, transparent 67%);
  z-index:-1;
}
.dictation-stage-inner { width:min(680px, 88%); text-align:center; padding: 54px 20px 44px; }
.dictation-kicker { color: var(--text-3); font-size: 14px; margin-bottom: 20px; }
.dictation-title { font-family:var(--serif); font-size: clamp(27px,3vw,36px); font-weight:500; letter-spacing:-.025em; margin: 0 0 8px; }
.dictation-instruction { color: var(--text-3); margin:0; }
.mic-area { position:relative; display:grid; place-items:center; height:170px; margin: 12px 0 4px; }
.mic-button {
  width: 104px;
  height: 104px;
  border-radius: 50%;
  border: 1px solid #4a3b47;
  background: #15131a;
  color: var(--accent-strong);
  cursor:pointer;
  display:grid;
  place-items:center;
  position:relative;
  z-index:2;
  box-shadow: inset 0 0 0 10px rgba(201,139,189,.035);
  transition: transform 160ms var(--ease), background 160ms var(--ease), border-color 160ms var(--ease), box-shadow 160ms var(--ease);
}
.mic-button:hover { transform: scale(1.025); border-color: rgba(228,162,214,.65); background:#18141b; }
.mic-button:active { transform:scale(.99); }
.mic-button svg { width: 42px; height:42px; stroke-width:1.5; }
.mic-button.recording { border-color: var(--accent); background: #20131d; box-shadow: inset 0 0 0 10px rgba(201,139,189,.055), 0 0 0 10px rgba(201,139,189,.055); }
.mic-button.recording::after { content:""; position:absolute; inset:-18px; border:1px solid rgba(201,139,189,.25); border-radius:50%; animation:pulse 1.8s infinite var(--ease); }
@keyframes pulse { 0%,100% { transform:scale(.95); opacity:.25;} 50%{ transform:scale(1.08); opacity:.8;} }
.waveform { position:absolute; inset:0; display:flex; justify-content:center; align-items:center; gap:4px; pointer-events:none; }
.waveform span { width:2px; height: 8px; border-radius:2px; background:var(--text-4); opacity:.45; transition:height 120ms ease, background 120ms ease, opacity 120ms ease; }
.waveform.live span { background:var(--accent); opacity:.95; animation:wave 720ms ease-in-out infinite alternate; }
.waveform.live span:nth-child(2n){ animation-delay:-90ms; }
.waveform.live span:nth-child(3n){ animation-delay:-190ms; }
.waveform.live span:nth-child(4n){ animation-delay:-270ms; }
.waveform.live span:nth-child(5n){ animation-delay:-360ms; }
@keyframes wave { from {height:8px;} to {height:44px;} }
.shortcut-line { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:18px; flex-wrap:wrap; color:var(--text-3); font-size:12px; }
kbd { font-family:var(--sans); color:var(--text-2); background:var(--surface-2); border:1px solid var(--line); border-bottom-color:#36333a; border-radius:6px; padding:4px 7px; box-shadow: inset 0 -1px 0 rgba(255,255,255,.03); font-size:12px; }
.session-rail {
  display:grid;
  grid-template-columns: 1fr 1.65fr 1fr;
  margin-top: 18px;
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
}
.session-item { padding: 18px 22px; min-width:0; }
.session-item + .session-item { border-left:1px solid var(--line-soft); }
.session-label { color:var(--text-4); text-transform:uppercase; font-size:10px; letter-spacing:.12em; font-weight:650; }
.session-value { margin-top:5px; color:var(--text); font-size:17px; letter-spacing:-.015em; }
.session-meta { color:var(--text-3); font-size:12px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.session-text { color:var(--text-2); font-size:13px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.toolbar { display:flex; gap:10px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
.search-field { position:relative; flex:1 1 320px; }
.search-field svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--text-4); }
.search-field .input { padding-left:40px; }
.filter-select { width:160px; }
.group-label { color:var(--text-3); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin:28px 0 10px; }
.transcript-list { border-top: 1px solid var(--line-soft); }
.transcript-row {
  display:grid;
  grid-template-columns: 120px minmax(0,1fr) auto;
  gap:20px;
  padding:22px 4px;
  border-bottom:1px solid var(--line-soft);
  align-items:start;
}
.transcript-meta { color:var(--text-3); font-size:12px; font-variant-numeric: tabular-nums; }
.transcript-meta strong { display:block; color:var(--text-2); font-weight:520; font-size:13px; margin-bottom:3px; }
.transcript-body { min-width:0; }
.transcript-text { color:var(--text-2); margin:0; white-space:pre-wrap; line-height:1.65; }
.transcript-text[contenteditable="true"] { border:1px solid var(--accent); border-radius:8px; padding:10px; background:var(--surface); outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
.row-actions { display:flex; gap:4px; opacity:.54; transition:opacity 120ms var(--ease); }
.transcript-row:hover .row-actions, .transcript-row:focus-within .row-actions { opacity:1; }
.empty-state { padding:70px 20px; text-align:center; border-top:1px solid var(--line-soft); color:var(--text-3); }
.empty-state strong { display:block; color:var(--text-2); font-size:16px; margin-bottom:6px; }

.playground-grid { display:grid; grid-template-columns: minmax(0,1.05fr) minmax(320px,.95fr); gap:24px; align-items:start; }
.command-panel, .preview-panel { border-top:1px solid var(--line); padding-top:22px; }
.section-title { font-family:var(--serif); font-size:23px; font-weight:500; letter-spacing:-.02em; margin:0 0 6px; }
.section-copy { color:var(--text-3); font-size:13px; margin:0 0 20px; }
.template-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
.template {
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:transparent;
  color:var(--text-3);
  min-height:64px;
  padding:10px 12px;
  text-align:left;
  cursor:pointer;
  transition:background 120ms var(--ease), border 120ms var(--ease), color 120ms var(--ease);
}
.template strong { color:var(--text-2); font-size:13px; font-weight:550; display:block; }
.template span { font-size:11px; display:block; margin-top:4px; }
.template:hover { background:rgba(255,255,255,.025); color:var(--text-2); }
.template.active { border-color:rgba(201,139,189,.45); background:var(--accent-soft); color:var(--text-2); }
.command-actions { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
.command-hint { color:var(--text-4); font-size:11px; }
.preview-surface { min-height:300px; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); padding:22px; }
.preview-placeholder { color:var(--text-4); display:grid; min-height:254px; place-items:center; text-align:center; }
.preview-result { color:var(--text-2); white-space:pre-wrap; line-height:1.7; }
.preview-meta { color:var(--text-4); font-size:11px; margin-bottom:15px; display:flex; justify-content:space-between; gap:10px; }
.example-list { margin-top:26px; display:grid; gap:2px; }
.example-button { border:0; background:transparent; color:var(--text-3); text-align:left; padding:10px 0; border-bottom:1px solid var(--line-soft); cursor:pointer; display:flex; justify-content:space-between; gap:20px; }
.example-button:hover { color:var(--text-2); }
.example-button span:last-child { color:var(--text-4); }

.preferences-shell { display:grid; grid-template-columns: 190px minmax(0,1fr); gap:38px; align-items:start; }
.prefs-nav { position:sticky; top:28px; display:grid; gap:3px; }
.prefs-nav a { color:var(--text-3); min-height:39px; padding:0 10px; display:flex; align-items:center; border-radius:7px; border-left:2px solid transparent; }
.prefs-nav a:hover { color:var(--text-2); background:rgba(255,255,255,.025); }
.prefs-nav a.active { color:var(--text); background:var(--accent-soft); border-left-color:var(--accent); }
.settings-pane { max-width:820px; }
.settings-section + .settings-section { margin-top:42px; }
.settings-heading { margin-bottom:15px; }
.settings-heading h2 { font-family:var(--serif); font-size:23px; font-weight:500; letter-spacing:-.02em; margin:0 0 5px; }
.settings-heading p { color:var(--text-3); font-size:13px; margin:0; }
.setting-list { border-top:1px solid var(--line-soft); }
.setting-row {
  min-height:74px;
  border-bottom:1px solid var(--line-soft);
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(180px,280px);
  gap:28px;
  align-items:center;
  padding:14px 0;
}
.setting-row--stack { grid-template-columns:1fr; gap:12px; }
.setting-name { color:var(--text-2); font-size:14px; font-weight:520; }
.setting-description { color:var(--text-3); font-size:12px; margin-top:3px; max-width:520px; }
.setting-control { justify-self:end; width:100%; max-width:280px; }
.switch { position:relative; width:42px; height:24px; display:inline-block; }
.switch input { opacity:0; width:0; height:0; position:absolute; }
.switch-track { position:absolute; inset:0; border-radius:999px; background:#2a282c; border:1px solid #39363c; cursor:pointer; transition:background 150ms var(--ease), border 150ms var(--ease); }
.switch-track::after { content:""; position:absolute; width:16px; height:16px; border-radius:50%; left:3px; top:3px; background:#aaa4a5; transition:transform 160ms var(--ease), background 160ms var(--ease); }
.switch input:checked + .switch-track { background:rgba(201,139,189,.24); border-color:rgba(201,139,189,.48); }
.switch input:checked + .switch-track::after { transform:translateX(18px); background:var(--accent-strong); }
.switch input:focus-visible + .switch-track { outline:2px solid var(--focus); outline-offset:3px; }
.segmented { display:inline-grid; grid-auto-flow:column; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:3px; gap:2px; }
.segmented button { min-width:72px; min-height:32px; border:0; border-radius:6px; background:transparent; color:var(--text-3); cursor:pointer; font-size:12px; }
.segmented button.active { background:var(--surface-3); color:var(--text); box-shadow:inset 0 0 0 1px rgba(255,255,255,.035); }
.range-wrap { display:grid; gap:7px; }
.range-wrap input[type=range] { width:100%; accent-color:var(--accent); }
.range-labels { display:flex; justify-content:space-between; color:var(--text-4); font-size:11px; }
.model-list { border-top:1px solid var(--line-soft); }
.model-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:center; padding:16px 0; border-bottom:1px solid var(--line-soft); }
.model-row.selected .model-name { color:var(--text); }
.model-name { color:var(--text-2); font-weight:530; }
.model-description { color:var(--text-3); font-size:12px; margin-top:3px; }
.badge { display:inline-flex; min-height:20px; align-items:center; border:1px solid var(--line); border-radius:999px; padding:0 7px; font-size:10px; color:var(--text-3); margin-left:7px; vertical-align:1px; }
.badge--accent { border-color:rgba(201,139,189,.28); color:var(--accent-strong); background:var(--accent-soft); }
.badge--success { border-color:rgba(103,201,168,.25); color:var(--success); background:var(--success-soft); }
.model-action { min-width:104px; display:flex; justify-content:flex-end; }
.progress { width:96px; height:4px; border-radius:4px; overflow:hidden; background:#242228; }
.progress span { display:block; height:100%; background:var(--accent); width:0; transition:width 180ms linear; }
.path-field { font-family:var(--mono); font-size:12px; }
.notice { display:grid; grid-template-columns:auto 1fr; gap:12px; border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px 14px; background:rgba(255,255,255,.015); color:var(--text-3); font-size:12px; }
.notice svg { width:18px; height:18px; margin-top:1px; }
.notice strong { color:var(--text-2); display:block; font-size:13px; margin-bottom:2px; }
.notice--privacy { border-color:rgba(201,139,189,.2); background:var(--accent-soft); }
.notice--warning { border-color:rgba(217,182,111,.25); background:var(--warning-soft); }
.secret-field { display:flex; gap:8px; }
.secret-field .input { flex:1; }
.shortcut-editor { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.shortcut-capture { min-height:42px; min-width:190px; border:1px solid var(--line); border-radius:8px; background:var(--surface); display:flex; align-items:center; gap:5px; padding:0 10px; color:var(--text-2); cursor:pointer; }
.shortcut-capture.listening { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); color:var(--accent-strong); }
.diagnostics { border-top:1px solid var(--line-soft); }
.diagnostic-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:center; min-height:66px; border-bottom:1px solid var(--line-soft); }
.diagnostic-name { color:var(--text-2); font-size:13px; font-weight:520; }
.diagnostic-note { color:var(--text-3); font-size:12px; margin-top:2px; }
.diagnostic-status { display:inline-flex; gap:7px; align-items:center; color:var(--text-3); font-size:12px; }
.diagnostic-status svg { width:16px; height:16px; }
.diagnostic-status.ready { color:var(--success); }
.diagnostic-status.warning { color:var(--warning); }
.spinner { width:15px; height:15px; border:2px solid rgba(255,255,255,.16); border-top-color:currentColor; border-radius:50%; animation:spin 700ms linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.toast-region { position:fixed; right:24px; bottom:24px; z-index:90; display:grid; gap:8px; pointer-events:none; }
.toast { min-width:260px; max-width:360px; border:1px solid var(--line); background:#161619; color:var(--text-2); box-shadow:var(--shadow-popover); border-radius:10px; padding:12px 14px; display:flex; align-items:center; gap:10px; animation:toastIn 180ms var(--ease); pointer-events:auto; font-size:13px; }
.toast svg { width:16px; height:16px; color:var(--success); flex:none; }
@keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:100; display:grid; place-items:center; padding:20px; animation:fadeIn 130ms ease; }
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal { width:min(460px,100%); border:1px solid var(--line); background:#141417; box-shadow:var(--shadow-popover); border-radius:14px; padding:22px; }
.modal h2 { font-family:var(--serif); font-size:23px; font-weight:500; margin:0 0 7px; }
.modal p { color:var(--text-3); font-size:13px; margin:0; }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:24px; }

.mobile-nav { display:none; }

@media (max-width: 1020px) {
  :root { --sidebar: 76px; --pad: 24px; }
  .sidebar { padding-inline:12px; align-items:center; }
  .brand { padding-inline:0; }
  .brand > span:last-child, .nav-list a span, .privacy-block div, .privacy-block > svg { display:none; }
  .nav-list { width:100%; }
  .nav-list a { justify-content:center; padding:0; }
  .nav-list a.active::before { left:2px; }
  .privacy-block { grid-template-columns:auto; justify-items:center; padding-inline:0; }
  .playground-grid { grid-template-columns:1fr; }
  .preview-surface { min-height:220px; }
}

@media (max-width: 760px) {
  :root { --pad: 16px; }
  body { padding-bottom:74px; }
  .sidebar { display:none; }
  .main { margin-left:0; padding-bottom:28px; }
  .page { padding-top:24px; }
  .page-header { margin-bottom:22px; align-items:flex-start; }
  .page-title { font-size:32px; }
  .page-actions { gap:7px; }
  .page-actions .select { width:140px; }
  .mobile-nav { display:grid; grid-template-columns:repeat(4,1fr); position:fixed; z-index:80; inset:auto 0 0; min-height:68px; padding:7px max(8px, env(safe-area-inset-right)) max(7px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background:rgba(13,13,16,.96); border-top:1px solid var(--line); backdrop-filter:blur(12px); }
  .mobile-nav a { display:grid; place-items:center; align-content:center; gap:3px; color:var(--text-4); font-size:10px; border-radius:8px; }
  .mobile-nav a svg { width:19px; height:19px; }
  .mobile-nav a.active { color:var(--accent-strong); background:var(--accent-soft); }
  .dictation-stage { min-height:380px; }
  .dictation-stage-inner { padding-inline:12px; }
  .session-rail { grid-template-columns:1fr 1fr; }
  .session-item:nth-child(2) { display:none; }
  .session-item:nth-child(3) { border-left:1px solid var(--line-soft); }
  .transcript-row { grid-template-columns:1fr auto; gap:14px; }
  .transcript-meta { grid-column:1/-1; display:flex; gap:8px; align-items:center; }
  .transcript-meta strong { margin:0; }
  .row-actions { opacity:1; }
  .preferences-shell { grid-template-columns:1fr; gap:20px; }
  .prefs-nav { position:static; display:flex; overflow-x:auto; padding-bottom:5px; scrollbar-width:none; margin-inline:-4px; }
  .prefs-nav::-webkit-scrollbar { display:none; }
  .prefs-nav a { flex:0 0 auto; min-height:36px; border-left:0; border-bottom:2px solid transparent; border-radius:0; padding:0 10px; }
  .prefs-nav a.active { background:transparent; border-bottom-color:var(--accent); }
  .setting-row { grid-template-columns:1fr auto; gap:16px; }
  .setting-control { max-width:210px; }
  .setting-row:has(.input), .setting-row:has(.select), .setting-row:has(.segmented), .setting-row:has(.shortcut-editor) { grid-template-columns:1fr; }
  .setting-row:has(.input) .setting-control, .setting-row:has(.select) .setting-control, .setting-row:has(.segmented) .setting-control, .setting-row:has(.shortcut-editor) .setting-control { justify-self:stretch; max-width:none; }
  .template-grid { grid-template-columns:1fr; }
  .template { min-height:54px; }
  .toast-region { left:12px; right:12px; bottom:82px; }
  .toast { min-width:0; width:100%; max-width:none; }
}

@media (max-width: 520px) {
  .page-header { display:block; }
  .page-actions { margin-top:16px; justify-content:flex-start; }
  .dictation-stage { min-height:360px; }
  .dictation-title { font-size:29px; }
  .mic-button { width:92px; height:92px; }
  .session-item { padding:14px 8px; }
  .session-value { font-size:15px; }
  .toolbar { align-items:stretch; }
  .filter-select { width:100%; }
  .transcript-row { padding-block:18px; }
  .row-actions .button span { display:none; }
  .model-row { grid-template-columns:1fr; }
  .model-action { justify-content:flex-start; }
  .setting-row { grid-template-columns:1fr auto; }
  .setting-description { max-width:290px; }
}

}

  <script>
(() => {
  'use strict';

  const app = document.querySelector('#app');
  const toastRegion = document.querySelector('#toastRegion');
  const modalRoot = document.querySelector('#modalRoot');

  const state = {
    recording: false,
    recordSeconds: 0,
    recordTimer: null,
    historyFilter: 'all',
    historySearch: '',
    playgroundTemplate: 'rewrite',
    playgroundResult: '',
    aiEnabled: true,
    apiVisible: false,
    autoPolish: true,
    model: 'small',
    downloads: {},
    shortcutCapture: false,
    shortcut: ['Ctrl', 'Alt', 'Space'],
    systemStatus: 'idle',
    settings: {
      theme: 'dark',
      timeout: 380,
      copyPhrases: true,
      startup: true,
      autoInsert: true,
      floatingWidget: true,
      autoSave: true,
      terminalPaste: true,
      listenBackground: true,
      language: 'Auto detect',
      provider: 'Gemini (fast)',
      modelName: 'gemini-3.5-flash',
      style: 'Concise rewrite'
    },
    transcripts: [
      {
        id: 1,
        group: 'Today',
        time: '7:23 PM',
        duration: '00:05',
        words: 10,
        text: 'I am checking if the transcription and polishing are working.'
      },
      {
        id: 2,
        group: 'Today',
        time: '7:21 PM',
        duration: '00:05',
        words: 23,
        text: 'Yes, it is working! I am online, responsive, and ready to help you test.\n\nHow can I assist you with your trial today?'
      }
    ]
  };

  const icons = (name, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  const escapeHTML = (str) => String(str).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const route = () => (location.hash || '#/dictation').replace(/^#\//, '').split('/');

  function toast(message, icon = 'check') {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `${icons(icon)}<span>${escapeHTML(message)}</span>`;
    toastRegion.appendChild(el);
    window.setTimeout(() => el.remove(), 2800);
  }

  function modal({ title, body, confirm = 'Confirm', destructive = false, onConfirm }) {
    modalRoot.innerHTML = `
      <div class="modal-backdrop" role="presentation" data-modal-close>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="event.stopPropagation()">
          <h2 id="modal-title">${escapeHTML(title)}</h2>
          <p>${escapeHTML(body)}</p>
          <div class="modal-actions">
            <button class="button" type="button" data-modal-close>Cancel</button>
            <button class="button ${destructive ? 'button--danger' : 'button--primary'}" type="button" data-modal-confirm>${escapeHTML(confirm)}</button>
          </div>
        </section>
      </div>`;
    const close = () => { modalRoot.innerHTML = ''; };
    modalRoot.querySelectorAll('[data-modal-close]').forEach(el => el.addEventListener('click', close));
    modalRoot.querySelector('[data-modal-confirm]').addEventListener('click', () => { onConfirm?.(); close(); });
    modalRoot.querySelector('[data-modal-confirm]').focus();
  }

  function updateNavigation() {
    const [root] = route();
    document.querySelectorAll('[data-route]').forEach(link => {
      const active = link.dataset.route === (root === 'preferences' ? 'preferences' : root);
      link.classList.toggle('active', active);
      if (active) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
    });
  }

  function pageHeader({ eyebrow, title, subtitle, actions = '' }) {
    return `
      <header class="page-header">
        <div>
          ${eyebrow ? `<div class="eyebrow">${escapeHTML(eyebrow)}</div>` : ''}
          <h1 class="page-title">${escapeHTML(title)}</h1>
          ${subtitle ? `<p class="page-subtitle">${escapeHTML(subtitle)}</p>` : ''}
        </div>
        ${actions ? `<div class="page-actions">${actions}</div>` : ''}
      </header>`;
  }

  function waveformBars() {
    return Array.from({length: 31}, (_, i) => `<span style="animation-duration:${620 + (i%7)*48}ms"></span>`).join('');
  }

  function renderDictation() {
    const status = state.recording
      ? `<span class="status-chip status-chip--live"><span class="status-dot status-dot--live"></span>Listening</span>`
      : `<span class="status-chip status-chip--ready"><span class="status-dot status-dot--ready"></span>Ready</span>`;

    const title = state.recording ? `Listening · ${formatTimer(state.recordSeconds)}` : 'Ready to dictate';
    const instruction = state.recording ? 'Release to transcribe · Esc to cancel' : 'Hold the shortcut, speak naturally, then release to insert.';

    app.innerHTML = `
      <section class="page" aria-labelledby="page-title">
        ${pageHeader({
          eyebrow: 'Private voice input',
          title: 'Dictation',
          subtitle: 'Fast, private speech-to-text that works wherever you type.',
          actions: `${status}<select class="select" id="languageSelect" aria-label="Dictation language" style="width:160px"><option>Auto detect</option><option>English</option><option>Spanish</option><option>French</option><option>German</option></select>`
        })}

        <section class="dictation-stage" aria-label="Dictation control">
          <div class="dictation-stage-inner">
            <div class="dictation-kicker">${state.recording ? 'Microphone active' : 'On-device microphone ready'}</div>
            <h2 class="dictation-title">${title}</h2>
            <p class="dictation-instruction">${instruction}</p>

            <div class="mic-area">
              <div class="waveform ${state.recording ? 'live' : ''}" aria-hidden="true">${waveformBars()}</div>
              <button class="mic-button ${state.recording ? 'recording' : ''}" id="micButton" type="button" aria-pressed="${state.recording}" aria-label="${state.recording ? 'Stop recording' : 'Start recording'}">
                ${icons(state.recording ? 'stop' : 'mic')}
              </button>
            </div>

            <div class="shortcut-line"><span>${state.recording ? 'Or press' : 'Push-to-talk'}</span><kbd>Ctrl</kbd><span>+</span><kbd>Alt</kbd><span>+</span><kbd>Space</kbd></div>
          </div>
        </section>

        <section class="session-rail" aria-label="Session summary">
          <div class="session-item">
            <div class="session-label">Today</div>
            <div class="session-value">33 words</div>
            <div class="session-meta">2 dictations</div>
          </div>
          <div class="session-item">
            <div class="session-label">Last dictation</div>
            <div class="session-text">I am checking if the transcription and polishing are working.</div>
            <div class="session-meta">7:23 PM · 10 words</div>
          </div>
          <div class="session-item">
            <div class="session-label">Engine</div>
            <div class="session-value">Small · CUDA</div>
            <div class="session-meta">Local Whisper · INT8</div>
          </div>
        </section>
      </section>`;

    document.querySelector('#micButton').addEventListener('click', toggleRecording);
    document.querySelector('#languageSelect').value = state.settings.language;
    document.querySelector('#languageSelect').addEventListener('change', e => state.settings.language = e.target.value);
  }

  function formatTimer(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function toggleRecording() {
    if (!state.recording) {
      state.recording = true;
      state.recordSeconds = 0;
      render();
      state.recordTimer = window.setInterval(() => {
        state.recordSeconds++;
        const heading = document.querySelector('.dictation-title');
        if (heading) heading.textContent = `Listening · ${formatTimer(state.recordSeconds)}`;
      }, 1000);
    } else {
      state.recording = false;
      window.clearInterval(state.recordTimer);
      state.recordTimer = null;
      render();
      toast('Inserted 18 words at the cursor.');
    }

      const matchesSearch = !query || t.text.toLowerCase().includes(query);
      const matchesFilter = state.historyFilter === 'all' || (state.historyFilter === 'today' && t.group === 'Today');
      return matchesSearch && matchesFilter;
    });

    app.innerHTML = `
      <section class="page" aria-labelledby="page-title">
        ${pageHeader({ title: 'History', subtitle: 'Search, edit, copy, and reuse transcripts saved locally.' })}

            <input class="input" id="historySearch" type="search" value="${escapeHTML(state.historySearch)}" placeholder="Search transcripts" aria-label="Search transcripts" />
          </label>
          <select class="select filter-select" id="historyFilter" aria-label="Filter history">
            <option value="all">All transcripts</option>
            <option value="today">Today</option>
          </select>
        </div>
        <div class="group-label">Today · ${filtered.length}</div>
        ${filtered.length ? `<div class="transcript-list">${filtered.map(transcriptRow).join('')}</div>` : `<div class="empty-state"><strong>No matching transcripts</strong>Try a broader search or clear the filter.</div>`}

    const search = document.querySelector('#historySearch');
    search.addEventListener('input', e => {

      search._timer = window.setTimeout(renderHistory, 120);

    try { search.setSelectionRange(search.value.length, search.value.length); } catch {}

    const filter = document.querySelector('#historyFilter');

  function bindHistoryActions() {
    document.querySelectorAll('.transcript-row').forEach(row => {
      const id = Number(row.dataset.transcript);
      row.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => historyAction(id, btn.dataset.action, row)));
    });
  }

  function historyAction(id, action, row) {
    const t = state.transcripts.find(x => x.id === id);
    if (!t) return;
    if (action === 'copy') {
      navigator.clipboard?.writeText(t.text).catch(() => {});
      toast('Transcript copied.');
    } else if (action === 'polish') {
      t.text = t.text.replace('I am checking if', 'I’m checking whether').replace('Yes, it is working!', 'Yes — it’s working.');
      t.words = t.text.split(/\s+/).filter(Boolean).length;
      renderHistory();
      toast('Transcript polished.');
    } else if (action === 'edit') {
      const p = row.querySelector('.transcript-text');
      if (p.contentEditable === 'true') {
        t.text = p.innerText.trim();
        t.words = t.text.split(/\s+/).filter(Boolean).length;
        p.contentEditable = 'false';
        toast('Transcript saved.');
      } else {
        p.contentEditable = 'true';
        p.focus();
        btnIconSwap(row, 'edit', 'check');
      }
    } else if (action === 'more') {
      modal({
        title: 'Delete transcript?',
        body: 'This transcript is stored locally. Deleting it cannot be undone.',
        confirm: 'Delete',
        destructive: true,
        onConfirm: () => {
          state.transcripts = state.transcripts.filter(x => x.id !== id);
          renderHistory();
          toast('Transcript deleted.');
        }
      });
    }
  }

  function captureShortcut(e) {
    if (!state.shortcutCapture) return;
    e.preventDefault();
    const parts = [];
    if (e.ctrlKey) parts.push('Ctrl');
    if (e.altKey) parts.push('Alt');
    if (e.shiftKey) parts.push('Shift');
    if (e.metaKey) parts.push('Meta');
    const modifierKeys = ['Control','Alt','Shift','Meta'];
    if (!modifierKeys.includes(e.key)) parts.push(e.code === 'Space' ? 'Space' : (e.key.length===1 ? e.key.toUpperCase() : e.key));
    if (parts.length < 2) {
      toast('Use at least one modifier plus another key.', 'alert');
      document.addEventListener('keydown', captureShortcut, {once:true});
      return;
    }
    state.shortcut = parts;
    state.shortcutCapture=false;
    renderPreferences('shortcuts');
    toast('Shortcut updated.');
  }

  function startModelDownload(id) {
    state.downloads[id]=2;
    renderPreferences('dictation');
    const timer = setInterval(() => {
      state.downloads[id] = Math.min(100, state.downloads[id] + Math.floor(7 + Math.random()*14));
      const bar = document.querySelector(`[data-download-model="${id}"]`);
      if (location.hash !== '#/preferences/dictation') { clearInterval(timer); return; }
      if (state.downloads[id] >= 100) {
        clearInterval(timer);
        installedModels.add(id);
        state.downloads[id]=100;
        renderPreferences('dictation');
        toast(`${id} model downloaded.`);
      } else {
        renderPreferences('dictation');
      }
    }, 260);
  }

  function runSystemCheck() {
    state.systemStatus='running';
    renderPreferences('system');
    setTimeout(()=>{
      state.systemStatus='ready';
      renderPreferences('system');
      toast('System check complete. Soundflow is ready.');
    }, 1600);
  }

  function render() {
    updateNavigation();
    const [root, section] = route();
    if (root === 'history') renderHistory();
    else if (root === 'playground') renderPlayground();
    else if (root === 'preferences') renderPreferences(section || 'general');
    else renderDictation();
    app.focus({preventScroll:true});
  }

  window.addEventListener('hashchange', render);
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.recording) {
      state.recording=false;
      clearInterval(state.recordTimer);
      state.recordTimer=null;
      render();
      toast('Dictation cancelled.', 'info');
    }
  });

  if (!location.hash) location.hash = '#/dictation';
  render();
})();

  </script>
</body>
</html>
