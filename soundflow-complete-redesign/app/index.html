<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="description" content="Soundflow — private, on-device voice dictation." />
  <title>Soundflow — Private Dictation</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 8.5c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 4.5-2M3 12c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 4.5-2M3 15.5c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 4.5-2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.3-5.8L3.5 8.5V4.5M3.5 8.5h4"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.8c.6 4.9 3.3 7.6 8.2 8.2-4.9.6-7.6 3.3-8.2 8.2-.6-4.9-3.3-7.6-8.2-8.2 4.9-.6 7.6-3.3 8.2-8.2Z"/><path d="M19 2.8c.2 1.6 1.1 2.5 2.7 2.7-1.6.2-2.5 1.1-2.7 2.7-.2-1.6-1.1-2.5-2.7-2.7 1.6-.2 2.5-1.1 2.7-2.7Z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Z"/><path d="M19.2 13.4a7.7 7.7 0 0 0 0-2.8l2-1.5-2-3.4-2.4 1a7.8 7.8 0 0 0-2.4-1.4L14 2.7h-4l-.4 2.6a7.8 7.8 0 0 0-2.4 1.4l-2.4-1-2 3.4 2 1.5a7.7 7.7 0 0 0 0 2.8l-2 1.5 2 3.4 2.4-1a7.8 7.8 0 0 0 2.4 1.4l.4 2.6h4l.4-2.6a7.8 7.8 0 0 0 2.4-1.4l2.4 1 2-3.4-2-1.5Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="10" height="10" rx="2"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16.5-.8 4.3 4.3-.8L19 8.5 15.5 5 4 16.5Z"/><path d="m13.5 7 3.5 3.5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M4 20h16"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 6 9 6-9 6V6Z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.8 12s3.4-5 9.2-5 9.2 5 9.2 5-3.4 5-9.2 5-9.2-5-9.2-5Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.2 7.2A10.5 10.5 0 0 1 12 7c5.8 0 9.2 5 9.2 5a12.8 12.8 0 0 1-2.6 2.8M6.2 6.3C4 7.7 2.8 12 2.8 12s3.4 5 9.2 5a9.7 9.7 0 0 0 3-.5M9.8 9.8a3 3 0 0 0 4.4 4.4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 4.7-2.8 8-7 10-4.2-2-7-5.3-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h.1M6 14h8M16 14h2"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M9 2v3M12 2v3M15 2v3M9 19v3M12 19v3M15 19v3M2 9h3M2 12h3M2 15h3M19 9h3M19 12h3M19 15h3"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9S14.3 18.5 12 21c-2.3-2.5-3.5-5.5-3.5-9S9.7 5.5 12 3Z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v5M12 17.5v.1"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7.5v.1"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#/dictation" aria-label="Soundflow home">
        <span class="brand-mark"><svg><use href="#i-wave"></use></svg></span>
        <span><strong>Soundflow</strong><small>Private dictation</small></span>
      </a>

      <nav class="nav-list">
        <a href="#/dictation" data-route="dictation"><svg><use href="#i-mic"></use></svg><span>Dictation</span></a>
        <a href="#/history" data-route="history"><svg><use href="#i-history"></use></svg><span>History</span></a>
        <a href="#/playground" data-route="playground"><svg><use href="#i-spark"></use></svg><span>Playground</span></a>
        <a href="#/preferences/general" data-route="preferences"><svg><use href="#i-settings"></use></svg><span>Preferences</span></a>
      </nav>

      <div class="privacy-block" tabindex="0" role="note" aria-label="On-device privacy status">
        <span class="status-dot status-dot--ready"></span>
        <div><strong>On-device</strong><span>Audio stays on this machine.</span></div>
        <svg><use href="#i-shield"></use></svg>
      </div>
    </aside>

    <main id="app" class="main" tabindex="-1"></main>

    <nav class="mobile-nav" aria-label="Primary navigation">
      <a href="#/dictation" data-route="dictation"><svg><use href="#i-mic"></use></svg><span>Dictate</span></a>
      <a href="#/history" data-route="history"><svg><use href="#i-history"></use></svg><span>History</span></a>
      <a href="#/playground" data-route="playground"><svg><use href="#i-spark"></use></svg><span>Play</span></a>
      <a href="#/preferences/general" data-route="preferences"><svg><use href="#i-settings"></use></svg><span>Settings</span></a>
    </nav>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modalRoot"></div>

  <script src="app.js"></script>
</body>
</html>
